<style>
  :root {
    /* Brend qo'llanmasi 1.6: #012d36 (to'q) va #81abaa (och-yashil) */
    --dark: #012d36;
    --dark2: #03424e;
    --teal: #81abaa;
    --teal-l: #a6c6c5;
    --teal-ink: #2f6866;        /* oq kartada och-yashil matn: >5:1 */
    --white: #ffffff;
    --text: #eef5f5;
    --muted: #b4cccb;           /* to'q fonda ikkinchi darajali matn: >7:1 */

    --glass: linear-gradient(180deg, rgba(129, 171, 170, .16) 0%, rgba(129, 171, 170, .08) 100%);
    --glass-solid: #0a3d47;
    --glass-line: rgba(166, 198, 197, .26);

    --r-tile: 22px;
    --gap: 12px;
    --sh: 0 1px 2px rgba(0, 0, 0, .18), 0 18px 36px -24px rgba(0, 0, 0, .7);
    --sh-hi: 0 2px 6px rgba(0, 0, 0, .2), 0 26px 46px -24px rgba(0, 0, 0, .8);
    --ease: cubic-bezier(.2, .7, .2, 1);
    --font: "Onest", "Segoe UI", system-ui, -apple-system, Roboto, Arial, sans-serif;
  }
  *, *::before, *::after { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; background: var(--dark); }
  body {
    margin: 0; min-height: 100vh;
    font-family: var(--font); font-size: 16px; line-height: 1.5;
    color: var(--text); background: transparent;
    -webkit-font-smoothing: antialiased; -webkit-tap-highlight-color: transparent;
    overflow-x: hidden;
  }
  a { color: inherit; text-decoration: none; }
  button { font: inherit; color: inherit; }
  .i { width: 24px; height: 24px; flex: none; display: block; }
  .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
  :where(a, button):focus-visible { outline: 3px solid var(--teal-l); outline-offset: 3px; }

  /* ===== FON: brend qurilish to'ri + sekin suzuvchi och-yashil shakllar ===== */
  .bg { position: fixed; inset: 0; z-index: -1; overflow: hidden; pointer-events: none; }
  .grid {
    position: absolute; inset: 0;
    background-image:
      linear-gradient(rgba(129, 171, 170, .07) 1px, transparent 1px),
      linear-gradient(90deg, rgba(129, 171, 170, .07) 1px, transparent 1px);
    background-size: 44px 44px;
    -webkit-mask-image: radial-gradient(120% 80% at 50% 0%, #000 30%, transparent 80%);
    mask-image: radial-gradient(120% 80% at 50% 0%, #000 30%, transparent 80%);
  }
  .shape { position: absolute; will-change: transform; }
  .s1 { /* qo'llanmadagi diagonal tasma (1.6 bo'lim) */
    width: 820px; height: 820px; right: -420px; top: -360px;
    background: linear-gradient(135deg, rgba(129, 171, 170, .30), rgba(129, 171, 170, .06));
    border-radius: 0 0 0 220px; transform: rotate(45deg);
    animation: drift1 40s ease-in-out infinite alternate;
  }
  .s2 {
    width: 640px; height: 640px; left: -360px; bottom: -300px;
    background: radial-gradient(closest-side, rgba(129, 171, 170, .22), rgba(129, 171, 170, 0));
    border-radius: 50%;
    animation: drift2 46s ease-in-out infinite alternate;
  }
  .s3 {
    width: 520px; height: 520px; right: -220px; top: 46%;
    background: radial-gradient(closest-side, rgba(3, 66, 78, .9), rgba(3, 66, 78, 0));
    border-radius: 50%;
  }
  @keyframes drift1 { from { transform: rotate(45deg) translate3d(0, 0, 0); } to { transform: rotate(45deg) translate3d(-60px, 40px, 0); } }
  @keyframes drift2 { from { transform: translate3d(0, 0, 0) scale(1); } to { transform: translate3d(90px, -50px, 0) scale(1.1); } }

  /* ===== SHISHA KARTA ===== */
  .glass {
    position: relative; background: var(--glass);
    border: 1px solid var(--glass-line); border-radius: var(--r-tile);
    box-shadow: inset 0 1px 0 rgba(255, 255, 255, .08), var(--sh);
    -webkit-backdrop-filter: blur(14px) saturate(140%); backdrop-filter: blur(14px) saturate(140%);
  }
  @supports not ((-webkit-backdrop-filter: blur(1px)) or (backdrop-filter: blur(1px))) { .glass { background: var(--glass-solid); } }
  .press { transition: transform .25s var(--ease), box-shadow .25s var(--ease), border-color .25s var(--ease); cursor: pointer; }
  @media (hover: hover) { .press:hover { transform: translateY(-2px); border-color: rgba(166, 198, 197, .5); box-shadow: inset 0 1px 0 rgba(255, 255, 255, .1), var(--sh-hi); } }
  .press:active { transform: scale(.985); transition-duration: .08s; }

  .go {
    display: grid; place-items: center; width: 38px; height: 38px; flex: none; border-radius: 50%;
    color: var(--white); background: rgba(129, 171, 170, .14); box-shadow: inset 0 0 0 1px rgba(166, 198, 197, .3);
    transition: background-color .25s var(--ease), color .25s var(--ease), transform .25s var(--ease), box-shadow .25s var(--ease);
  }
  .go .i { width: 17px; height: 17px; }
  @media (hover: hover) { .press:hover .go { background: var(--teal); color: var(--dark); box-shadow: none; transform: translate(2px, -2px); } }
  .press:focus-visible .go { background: var(--teal); color: var(--dark); box-shadow: none; }

  .chip {
    display: grid; place-items: center; width: 48px; height: 48px; flex: none; border-radius: 14px;
    color: var(--dark); background: var(--teal);
    box-shadow: inset 0 1px 0 rgba(255, 255, 255, .3), 0 8px 16px -10px rgba(0, 0, 0, .8); overflow: hidden;
  }
  .chip .i { width: 23px; height: 23px; }
  .link .chip { width: 52px; height: 52px; border-radius: 15px; }
  .link .chip .i { width: 27px; height: 27px; }
  .chip.ig { background: radial-gradient(circle at 28% 108%, #FEDA75 0%, #FA7E1E 24%, #D62976 52%, #962FBF 76%, #4F5BD5 100%); }
  .chip.web { background: var(--dark); box-shadow: inset 0 0 0 1px rgba(166, 198, 197, .35), 0 8px 16px -12px rgba(0, 0, 0, .8); color: var(--teal); }
  .chip.web svg { width: 36px; height: auto; }

  /* ===== JOYLASHUV ===== */
  .wrap { max-width: 460px; margin: 0 auto; padding: calc(16px + env(safe-area-inset-top)) 16px 0; }
  .bento { display: grid; gap: var(--gap); }

  /* Identifikatsiya */
  .id { overflow: hidden; isolation: isolate; padding: 22px 20px 24px; display: flex; flex-direction: column; }
  .id::after { /* qo'llanmadagi yumaloq burchakli brend shakli */
    content: ""; position: absolute; z-index: -1; right: -70px; bottom: -110px; width: 230px; height: 230px;
    background: rgba(129, 171, 170, .12); border-radius: 60px 0 0 0; transform: rotate(45deg);
  }
  .id-top { display: flex; align-items: center; justify-content: flex-end; }
  .lang { display: flex; gap: 2px; padding: 3px; border-radius: 999px; background: rgba(0, 0, 0, .18); box-shadow: inset 0 0 0 1px rgba(166, 198, 197, .2); }
  .lang button {
    position: relative; min-width: 46px; height: 38px; padding: 0 12px; border: 0; border-radius: 999px;
    background: transparent; color: var(--muted); font-size: 13px; font-weight: 600; letter-spacing: .08em; cursor: pointer;
    transition: background-color .2s var(--ease), color .2s var(--ease);
  }
  .lang button::after { content: ""; position: absolute; inset: -5px -1px; }
  .lang button[aria-pressed="true"] { background: var(--teal); color: var(--dark); }
  @media (hover: hover) { .lang button[aria-pressed="false"]:hover { color: var(--white); } }
  .id-body { margin-top: 22px; }
  .wordmark { margin: 0; line-height: 0; color: var(--teal); }
  .wordmark svg { width: min(250px, 72%); height: auto; display: block; }
  .slogan { margin: 14px 0 0; font-size: 13px; font-weight: 500; letter-spacing: .62em; color: var(--teal); text-transform: none; }
  .tagline { margin: 18px 0 0; font-size: 15px; font-weight: 500; line-height: 1.4; letter-spacing: .04em; color: var(--text); text-transform: uppercase; }

  /* Havolalar */
  .links { display: grid; gap: var(--gap); }
  .link { display: flex; align-items: center; gap: 14px; min-height: 78px; padding: 13px 14px 13px 13px; }
  .link-txt { display: flex; flex-direction: column; flex: 1; min-width: 0; }
  .link-title { font-size: 17px; font-weight: 600; line-height: 1.25; color: var(--white); }
  .link-sub { font-size: 14px; line-height: 1.35; color: var(--muted); overflow-wrap: anywhere; }

  /* Aloqa */
  .contact { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: var(--gap); }
  .call {
    grid-column: 1 / -1; position: relative; overflow: hidden; isolation: isolate;
    display: flex; flex-direction: column; padding: 8px; border-radius: var(--r-tile); color: var(--dark);
    background: linear-gradient(155deg, #a3c4c3 0%, var(--teal) 55%, #6f9c9b 100%);
    box-shadow: inset 0 1px 0 rgba(255, 255, 255, .35), 0 22px 40px -22px rgba(0, 0, 0, .8);
  }
  .call::before { content: ""; position: absolute; z-index: -1; right: -60px; top: -120px; width: 220px; height: 220px; background: rgba(1, 45, 54, .08); border-radius: 0 0 0 70px; transform: rotate(45deg); }
  .call-label { margin: 8px 12px 6px; font-size: 11.5px; font-weight: 700; letter-spacing: .16em; text-transform: uppercase; color: rgba(1, 45, 54, .78); }
  .call a { border-radius: 16px; transition: background-color .2s var(--ease), transform .2s var(--ease); }
  .call a:focus-visible { outline-color: var(--dark); outline-offset: 0; }
  .call-main { display: flex; align-items: center; gap: 14px; min-height: 72px; padding: 10px 10px 10px 8px; }
  .bubble { display: grid; place-items: center; width: 52px; height: 52px; flex: none; border-radius: 15px; color: var(--teal); background: var(--dark); box-shadow: 0 10px 20px -10px rgba(1, 45, 54, .9); }
  .bubble .i { width: 24px; height: 24px; }
  .call-txt { display: flex; flex-direction: column; flex: 1; min-width: 0; }
  .call .t1 { font-size: 19px; font-weight: 700; line-height: 1.2; }
  .call .t2 { font-size: 16px; font-weight: 600; color: rgba(1, 45, 54, .86); font-variant-numeric: tabular-nums; letter-spacing: .01em; white-space: nowrap; }
  .call .go { background: rgba(1, 45, 54, .1); color: var(--dark); box-shadow: inset 0 0 0 1px rgba(1, 45, 54, .2); }
  @media (hover: hover) {
    .call a:hover { background: rgba(255, 255, 255, .14); }
    .call-main:hover .go { background: var(--dark); color: var(--teal); box-shadow: none; transform: translate(2px, -2px); }
  }
  .call a:active { background: rgba(255, 255, 255, .2); transform: scale(.99); }
  .call-main:focus-visible .go { background: var(--dark); color: var(--teal); }

  .act { display: flex; flex-direction: column; justify-content: space-between; align-items: flex-start; min-height: 132px; padding: 14px; text-align: left; }

  .act-sub { display: block; margin-top: 2px; font-size: 13px; color: var(--muted); }

  /* Pastki qism */
  .foot { display: flex; align-items: center; justify-content: center; gap: 10px; padding: 22px 16px calc(26px + env(safe-area-inset-bottom)); font-size: 13px; color: var(--muted); }
  .foot .dot { width: 4px; height: 4px; border-radius: 50%; background: rgba(180, 204, 203, .55); }
  .foot a { text-decoration: underline; text-decoration-color: rgba(180, 204, 203, .45); text-underline-offset: 3px; padding: 12px 2px; }

  .toast {
    position: fixed; z-index: 10; left: 50%; bottom: calc(20px + env(safe-area-inset-bottom));
    display: flex; align-items: center; gap: 10px; max-width: calc(100% - 32px); padding: 12px 18px 12px 14px;
    border-radius: 999px; background: var(--teal); color: var(--dark); font-size: 15px; font-weight: 600;
    box-shadow: 0 16px 36px -14px rgba(0, 0, 0, .8);
    opacity: 0; transform: translate(-50%, 16px); pointer-events: none; transition: opacity .25s var(--ease), transform .3s var(--ease);
  }
  .toast .i { width: 20px; height: 20px; }
  .toast.show { opacity: 1; transform: translate(-50%, 0); }

  @keyframes rise { from { opacity: 0; transform: translateY(14px) scale(.985); } to { opacity: 1; transform: none; } }
  .rv { animation: rise .7s var(--ease) both; animation-delay: calc(var(--d, 0) * 65ms + 60ms); }
  @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }

  @media (max-width: 374px) {
    :root { --gap: 10px; }
    .wrap { padding-left: 12px; padding-right: 12px; }
    .id { padding: 18px 16px 20px; }
    .slogan { letter-spacing: .5em; }
    .link { gap: 12px; padding: 12px 12px 12px 11px; }
    .call-main { gap: 12px; }
    .call .t1 { font-size: 18px; }
    .act { padding: 13px 12px; }
    .act-label { font-size: 15px; }
  }
  @media (min-width: 600px) {
    .wrap { max-width: 640px; padding-top: calc(28px + env(safe-area-inset-top)); }
    :root { --gap: 14px; }
  }
  @media (min-width: 900px) {

    .wrap { max-width: 1040px; padding: 56px 32px 0; }
    .bento { grid-template-columns: repeat(12, minmax(0, 1fr)); }
    .id { grid-column: 1 / span 5; padding: 26px 28px 30px; justify-content: space-between; }
    .id::after { width: 300px; height: 300px; right: -90px; bottom: -150px; }
    .wordmark svg { width: 300px; }

    .contact { grid-column: 1 / -1; grid-template-columns: repeat(12, minmax(0, 1fr)); }

    .call-main { padding: 18px 18px 20px; }
    .bubble { width: 60px; height: 60px; border-radius: 18px; }
    .call .t1 { font-size: 24px; }

    .act { grid-column: span 3; min-height: 150px; padding: 18px; }
    .act-label { font-size: 17px; }
    .foot { padding-top: 34px; padding-bottom: 40px; }
  }
</style>

<script>
  (function () {
    "use strict";
    var SHARE_URL = "https://links.jmar.uz/";
    var PHONE = "+998935555358", SITE = "https://jmar.uz", IG = "https://www.instagram.com/jmar_uz/";
    var I18N = {
      uz: { title: "Jmar — Havolalar", links: "Havolalar", site: "Rasmiy sayt", call: "Qo‘ng‘iroq qilish",
            save: "Kontaktni saqlash", share: "Ulashish", contact: "Aloqa",
            tVcf: "Kontakt fayli yuklandi", tVcfFail: "Kontaktni saqlab bo‘lmadi", tLink: "Havoladan nusxa olindi",
            shareText: "Jmar — Great Partners" },
      ru: { title: "Jmar — Ссылки", links: "Ссылки", site: "Официальный сайт", call: "Позвонить",
            save: "Сохранить контакт", share: "Поделиться", contact: "Контакты",
            tVcf: "Файл контакта загружен", tVcfFail: "Не удалось сохранить контакт", tLink: "Ссылка скопирована",
            shareText: "Jmar — Great Partners" }
    };
    var lang = "uz";
    var qLang = (/[?&]lang=(uz|ru)\b/i.exec(location.search) || [])[1];
    try {
      var saved = localStorage.getItem("jmar-lang");
      if (qLang) lang = qLang.toLowerCase();
      else if (saved === "uz" || saved === "ru") lang = saved;
      else if (/^ru\b/i.test(navigator.language || "")) lang = "ru";
    } catch (e) {
      if (qLang) lang = qLang.toLowerCase();
      else if (/^ru\b/i.test(navigator.language || "")) lang = "ru";
    }
    function T(k) { return I18N[lang][k]; }
    var langBtns = document.querySelectorAll(".lang button");
    function applyLang(l, remember) {
      lang = I18N[l] ? l : "uz";
      document.documentElement.lang = lang;
      document.title = T("title");
      var els = document.querySelectorAll("[data-i18n]");
      for (var i = 0; i < els.length; i++) {
        var key = els[i].getAttribute("data-i18n");
        if (I18N[lang][key] != null) els[i].textContent = I18N[lang][key];
      }
      for (var j = 0; j < langBtns.length; j++) langBtns[j].setAttribute("aria-pressed", String(langBtns[j].getAttribute("data-lang") === lang));
      if (remember) { try { localStorage.setItem("jmar-lang", lang); } catch (e) {} }
    }
    for (var b = 0; b < langBtns.length; b++) langBtns[b].addEventListener("click", function () { applyLang(this.getAttribute("data-lang"), true); });
    applyLang(lang, false);

    var toastEl = document.getElementById("toast"), toastMsg = document.getElementById("toast-msg"), toastTimer;
    function toast(msg) {
      toastMsg.textContent = msg; toastEl.classList.add("show");
      clearTimeout(toastTimer); toastTimer = setTimeout(function () { toastEl.classList.remove("show"); }, 2200);
    }
    function legacyCopy(text) {
      try {
        var t = document.createElement("textarea");
        t.value = text; t.setAttribute("readonly", "");
        t.style.position = "fixed"; t.style.top = "0"; t.style.left = "0"; t.style.opacity = "0";
        document.body.appendChild(t); t.select(); t.setSelectionRange(0, text.length);
        var ok = document.execCommand("copy"); document.body.removeChild(t); return ok;
      } catch (e) { return false; }
    }
    function copyText(text) {
      if (navigator.clipboard && window.isSecureContext) return navigator.clipboard.writeText(text).then(function () { return true; }, function () { return legacyCopy(text); });
      return Promise.resolve(legacyCopy(text));
    }

    function esc(v) { return String(v).replace(/\\/g, "\\\\").replace(/\n/g, "\\n").replace(/([,;])/g, "\\$1"); }
    function buildVCard() {
      return [
        "BEGIN:VCARD", "VERSION:3.0",
        "N:" + esc("Jmar") + ";;;;", "FN:" + esc("Jmar"), "ORG:" + esc("Jmar"), "X-ABShowAs:COMPANY",
        "TEL;TYPE=WORK,VOICE:" + PHONE,
        "URL:" + SITE,
        "X-SOCIALPROFILE;TYPE=instagram:" + IG,
        "NOTE:" + esc("Great Partners"),
        "END:VCARD"
      ].join("\r\n") + "\r\n";
    }
    window.__jmarVCard = buildVCard;   // faqat sinov uchun
    document.getElementById("vcard").addEventListener("click", function () {
      try {
        var blob = new Blob([buildVCard()], { type: "text/vcard;charset=utf-8" });
        var url = URL.createObjectURL(blob), a = document.createElement("a");
        a.href = url; a.download = "Jmar.vcf"; a.rel = "noopener";
        document.body.appendChild(a); a.click(); document.body.removeChild(a);
        setTimeout(function () { URL.revokeObjectURL(url); }, 4000);
        toast(T("tVcf"));
      } catch (e) { toast(T("tVcfFail")); }
    });
    document.getElementById("share").addEventListener("click", function () {
      var data = { title: T("title"), text: T("shareText"), url: SHARE_URL };
      if (navigator.share) navigator.share(data).catch(function (err) { if (err && err.name === "AbortError") return; fallbackShare(); });
      else fallbackShare();
    });
    function fallbackShare() { copyText(SHARE_URL).then(function (ok) { toast(ok ? T("tLink") : SHARE_URL); }); }
  })();
</script>
